services:
  postgres:
    image: postgres:16-alpine
    container_name: tlx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tlx
      POSTGRES_PASSWORD: tlx@admin.com
      POSTGRES_DB: tlx_cloud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tlx -d tlx_cloud"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: